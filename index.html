<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Smart Store Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/index.css?v=20261009-orders2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-shell">
    <div class="status-bar" id="status" hidden></div>

    <header class="header">
      <div class="header-inner">
        <img class="header-logo" id="brandLogo" src="assets/Aldo%20Lanches%20logo.jpg" alt="Logo do restaurante">
        <div class="header-info">
          <h1 class="header-name" id="brandName">Restaurante</h1>
          <p class="header-hours" id="brandSchedule">Horário não informado</p>
          <div class="quick-info">
            <a class="quick-pill quick-action" id="brandPhoneLink" href="#" target="_blank" rel="noopener" aria-label="Abrir conversa no WhatsApp">
              WhatsApp: <strong id="brandPhone">-</strong>
            </a>
            <a class="quick-pill quick-action" id="brandPixLink" href="#" target="_blank" rel="noopener" aria-label="Abrir link de pagamento PIX">
              <strong id="brandPix">Pagar com PIX</strong>
            </a>
          </div>
        </div>
        <div class="header-account-actions">
          <button type="button" class="account-btn" id="myOrdersBtn" hidden>Meus pedidos</button>
          <button type="button" class="account-btn" id="accountBtn">Entrar</button>
        </div>
      </div>
    </header>

    <section class="tools">
      <div id="storeInfo" class="store-info" hidden>
        <div class="store-info-text" id="storeInfoText"></div>
      </div>
      <input id="searchInput" class="search-box" type="search" placeholder="Buscar por nome ou descrição" aria-label="Buscar item no cardápio">
      <nav class="cat-nav" id="catNav" aria-label="Categorias"></nav>
    </section>

    <main class="main" id="menu"></main>
  </div>

  <div class="modal-backdrop" id="itemModal">
    <div id="modalBody"></div>
  </div>

  <div class="account-backdrop" id="accountBackdrop" hidden>
    <section class="account-dialog" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
      <div class="account-dialog-head">
        <h2 id="accountTitle">Sua conta</h2>
        <button type="button" class="ghost-btn" id="closeAccountBtn" aria-label="Fechar">×</button>
      </div>
      <p class="account-email" id="accountEmail"></p>
      <form id="profileForm">
        <label>Como você é conhecido?
          <input name="known_as" autocomplete="nickname" maxlength="100" required>
        </label>
        <label>Telefone
          <input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" required>
        </label>
        <label>Onde você mora?
          <input name="street" autocomplete="address-level2" maxlength="180" required>
        </label>
        <label>Ponto de referência
          <input name="landmark" maxlength="180">
        </label>
        <label>Complemento
          <input name="address_extra" autocomplete="address-line2" maxlength="180">
        </label>
        <div class="account-actions">
          <button type="submit" class="checkout-btn" id="saveProfileBtn">Salvar</button>
          <button type="button" class="ghost-btn" id="signOutBtn" hidden>Sair</button>
        </div>
      </form>
    </section>
  </div>

  <div class="cart-backdrop" id="cartBackdrop">
    <aside class="cart-panel" role="dialog" aria-modal="true" aria-label="Carrinho">
      <header class="cart-head">
        <h3>Seu carrinho</h3>
        <button type="button" id="closeCartBtn" class="ghost-btn">Fechar</button>
      </header>
      <div class="cart-list" id="cartList"></div>
      <footer class="cart-foot">
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cartTotal">R$ 0,00</strong>
        </div>
        <textarea id="cartNote" class="cart-note" placeholder="Especificações do pedido e da entrega (opcional)"></textarea>
        <button type="button" class="ghost-btn remove-unavailable-btn" id="removeUnavailableBtn" hidden>Remover indisponíveis</button>
        <div class="copy-message-row">
          <button type="button" class="ghost-btn" id="copyMessageBtn">Copiar mensagem</button>
          <span class="copy-message-hint"> << Se WhatsApp não abrir, cole lá</span>
        </div>
        <button type="button" class="checkout-btn app-checkout-btn" id="appCheckoutBtn">Entrar para fazer o pedido</button>
        <button type="button" class="checkout-btn" id="checkoutBtn">Finalizar no WhatsApp</button>
      </footer>
    </aside>
  </div>

  <div class="account-backdrop" id="checkoutConfirmBackdrop" hidden>
    <section class="account-dialog order-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="checkoutConfirmTitle">
      <div class="account-dialog-head">
        <h2 id="checkoutConfirmTitle">Confirmar pedido</h2>
        <button type="button" class="ghost-btn" id="closeCheckoutConfirmBtn" aria-label="Fechar">×</button>
      </div>
      <div id="checkoutDeliveryInfo" class="checkout-delivery-info"></div>
      <div id="checkoutConfirmItems" class="order-confirm-items"></div>
      <div class="order-confirm-total"><span>Total</span><strong id="checkoutConfirmTotal"></strong></div>
      <label class="order-payment-label">Pagamento
        <select id="orderPaymentMethod"><option value="pix">Pix</option><option value="at_delivery">Pessoalmente na entrega</option></select>
      </label>
      <div class="account-actions">
        <button type="button" class="ghost-btn" id="backToCartBtn">Voltar</button>
        <button type="button" class="checkout-btn" id="confirmAppOrderBtn">Confirmar pedido</button>
      </div>
    </section>
  </div>

  <div class="account-backdrop" id="customerOrdersBackdrop" hidden>
    <section class="account-dialog customer-orders-dialog" role="dialog" aria-modal="true" aria-labelledby="customerOrdersTitle">
      <div class="account-dialog-head">
        <button type="button" class="ghost-btn" id="backToOrdersListBtn" hidden>Voltar</button>
        <h2 id="customerOrdersTitle">Meus pedidos</h2>
        <button type="button" class="ghost-btn" id="closeCustomerOrdersBtn" aria-label="Fechar">×</button>
      </div>
      <div id="customerOrderList" class="customer-order-list"></div>
      <div id="customerOrderDetail" class="customer-order-detail" hidden></div>
    </section>
  </div>

  <button type="button" class="cart-fab" id="cartFab" aria-label="Abrir carrinho">
    <span id="cartFabCount">0 itens</span>
    <strong id="cartFabTotal">R$ 0,00</strong>
  </button>

  <footer class="creditos-dev">
    <p class="creditos-dev-line">Desenvolvido por <strong>Gabriel J Santos</strong></p>
    <nav class="creditos-dev-links" aria-label="Links do desenvolvedor">
      <a href="https://github.com/gabrieljsantos" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/gabriel-j-santos/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/gabriel_j.santos_?igsh=azZ1b2E0b3VqdTBu" target="_blank" rel="noopener">Instagram *</a>
    </nav>
  </footer>

  <script src="assets/js/index.js?v=20261009-package-flow1"></script>
</body>
</html>
