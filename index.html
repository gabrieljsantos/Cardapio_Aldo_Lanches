<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Smart Store Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/index.css?v=20261010-highlight-sellable-price">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-shell">
    <div class="status-bar" id="status" hidden></div>

    <header class="header">
      <div class="header-inner">
        <img class="header-logo" id="brandLogo" src="assets/Aldo%20Lanches%20logo.jpg" alt="Logo do restaurante">
        <div class="header-info">
          <h1 class="header-name" id="brandName">Restaurante</h1>
          <p class="header-hours" id="brandSchedule">Horário não informado</p>
          <div class="quick-info">
            <a class="quick-pill quick-action" id="brandPhoneLink" href="#" target="_blank" rel="noopener" aria-label="Abrir conversa no WhatsApp">
              WhatsApp: <strong id="brandPhone">-</strong>
            </a>
            <a class="quick-pill quick-action" id="brandPixLink" href="#" target="_blank" rel="noopener" aria-label="Abrir link de pagamento PIX">
              <strong id="brandPix">Pagar com PIX</strong>
            </a>
          </div>
        </div>
        <div class="header-account-actions">
          <button type="button" class="account-btn" id="accountBtn">Entrar</button>
        </div>
      </div>
    </header>

    <nav class="customer-tabs" id="customerTabs" aria-label="Navegação do cardápio">
      <button type="button" class="customer-tab active" data-customer-page="catalog">Cardápio</button>
      <button type="button" class="customer-tab" data-customer-page="orders">Meus pedidos</button>
      <button type="button" class="customer-tab" data-customer-page="tracking">Acompanhar</button>
      <button type="button" class="customer-tab" data-customer-page="profile">Meus dados</button>
    </nav>

    <section id="catalogPage" class="customer-page active">
    <section class="tools">
      <div id="storeInfo" class="store-info" hidden>
        <div class="store-info-text" id="storeInfoText"></div>
      </div>
      <input id="searchInput" class="search-box" type="search" placeholder="Buscar por nome ou descrição" aria-label="Buscar item no cardápio">
      <nav class="cat-nav" id="catNav" aria-label="Categorias"></nav>
    </section>

    <main class="main" id="menu"></main>
    </section>

    <section id="ordersPage" class="customer-page" hidden>
      <div class="customer-page-heading"><h2>Meus pedidos</h2></div>
      <div id="customerOrderList" class="customer-order-list"></div>
    </section>

    <section id="trackingPage" class="customer-page" hidden>
      <div class="customer-page-heading"><h2>Acompanhar</h2></div>
      <div id="activeCustomerOrders" class="active-customer-orders"></div>
    </section>

    <section id="profilePage" class="customer-page" hidden>
      <div class="profile-page-card">
        <div class="customer-page-heading"><h2>Meus dados</h2><button type="button" class="ghost-btn" id="signOutBtn" hidden>Sair</button></div>
        <p class="account-email" id="accountEmail"></p>
        <form id="profileForm">
          <label>Como você é conhecido?<input name="known_as" autocomplete="nickname" maxlength="100" required></label>
          <div class="phone-fields" role="group" aria-label="Telefone">
            <label>País<input name="phone_country_code" type="tel" autocomplete="tel-country-code" inputmode="tel" value="+55" maxlength="4" required></label>
            <label>DDD<input name="phone_area_code" type="tel" autocomplete="tel-area-code" inputmode="numeric" value="79" maxlength="2" pattern="[0-9]{2}" required></label>
            <label>Número<input name="phone_number" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="14" required></label>
          </div>
          <label>Onde você mora?<input name="street" autocomplete="address-level2" maxlength="180" required></label>
          <label>Ponto de referência<input name="landmark" maxlength="180"></label>
          <label>Complemento<input name="address_extra" autocomplete="address-line2" maxlength="180"></label>
          <div class="account-actions"><button type="submit" class="checkout-btn" id="saveProfileBtn">Salvar</button></div>
        </form>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="itemModal">
    <div id="modalBody"></div>
  </div>

  <div class="cart-backdrop" id="cartBackdrop">
    <aside class="cart-panel" role="dialog" aria-modal="true" aria-label="Carrinho">
      <header class="cart-head">
        <h3>Seu carrinho</h3>
        <button type="button" id="closeCartBtn" class="ghost-btn">← Voltar</button>
      </header>
      <p id="cartNotice" class="cart-notice" hidden></p>
      <div class="cart-list" id="cartList"></div>
      <footer class="cart-foot">
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cartTotal">R$ 0,00</strong>
        </div>
        <textarea id="cartNote" class="cart-note" placeholder="Especificações do pedido e da entrega (opcional)"></textarea>
        <button type="button" class="ghost-btn remove-unavailable-btn" id="removeUnavailableBtn" hidden>Remover indisponíveis</button>
        <div class="copy-message-row">
          <button type="button" class="ghost-btn" id="copyMessageBtn">Copiar mensagem</button>
          <span class="copy-message-hint"> << Se WhatsApp não abrir, cole lá</span>
        </div>
        <button type="button" class="checkout-btn app-checkout-btn" id="appCheckoutBtn">Entrar para fazer o pedido</button>
        <button type="button" class="checkout-btn whatsapp-checkout-btn" id="checkoutBtn"><svg class="whatsapp-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.1 3.9A11.8 11.8 0 0 0 1.6 18.1L.4 23.6l5.6-1.2A11.8 11.8 0 1 0 20.1 3.9ZM12 21a9 9 0 0 1-4.6-1.3l-.3-.2-3.3.7.7-3.2-.2-.3A9 9 0 1 1 12 21Zm5-6.7c-.3-.2-1.7-.9-2-.9s-.5-.2-.7.2-.8.9-1 1.1-.4.2-.7 0a7.4 7.4 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.4.3-.5s0-.4 0-.5-.7-1.6-.9-2.1-.5-.4-.7-.4h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.3 1 2.7 1.1 2.9a10.6 10.6 0 0 0 4 4c.5.2 1 .4 1.3.5.5.2 1 .2 1.4.1.4-.1 1.7-.7 1.9-1.3.2-.6.2-1.1.1-1.2s-.3-.2-.5-.3Z"/></svg><span data-checkout-label>Finalizar no WhatsApp</span></button>
      </footer>
    </aside>
  </div>

  <div class="account-backdrop" id="checkoutConfirmBackdrop" hidden>
    <section class="account-dialog order-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="checkoutConfirmTitle">
      <div class="account-dialog-head">
        <h2 id="checkoutConfirmTitle">Confirmar pedido</h2>
        <button type="button" class="ghost-btn" id="closeCheckoutConfirmBtn" aria-label="Fechar">×</button>
      </div>
      <div id="checkoutDeliveryInfo" class="checkout-delivery-info"></div>
      <div id="checkoutConfirmItems" class="order-confirm-items"></div>
      <div class="order-confirm-total"><span>Total</span><strong id="checkoutConfirmTotal"></strong></div>
      <label class="order-payment-label">Pagamento
        <select id="orderPaymentMethod"><option value="pix">Pix</option><option value="at_delivery">Pessoalmente na entrega</option></select>
      </label>
      <div class="account-actions">
        <button type="button" class="ghost-btn" id="backToCartBtn">Voltar</button>
        <button type="button" class="checkout-btn" id="confirmAppOrderBtn">Confirmar pedido</button>
      </div>
    </section>
  </div>

  <div class="account-backdrop" id="customerOrderDetailBackdrop" hidden>
    <section class="account-dialog customer-orders-dialog" role="dialog" aria-modal="true" aria-labelledby="customerOrderDetailTitle">
      <div class="account-dialog-head"><h2 id="customerOrderDetailTitle">Pedido</h2><button type="button" class="ghost-btn" id="closeCustomerOrderDetailBtn" aria-label="Fechar">Fechar</button></div>
      <div id="customerOrderDetail" class="customer-order-detail"></div>
    </section>
  </div>

  <button type="button" class="cart-fab" id="cartFab" aria-label="Abrir carrinho">
    <span id="cartFabCount">0 itens</span>
    <strong id="cartFabTotal">R$ 0,00</strong>
  </button>

  <footer class="creditos-dev">
    <p class="creditos-dev-line">Desenvolvido por <strong>Gabriel J Santos</strong></p>
    <nav class="creditos-dev-links" aria-label="Links do desenvolvedor">
      <a href="https://github.com/gabrieljsantos" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/gabriel-j-santos/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/gabriel_j.santos_?igsh=azZ1b2E0b3VqdTBu" target="_blank" rel="noopener">Instagram *</a>
    </nav>
  </footer>

  <script src="assets/js/index.js?v=20261010-highlight-sellable-price"></script>
</body>
</html>
